#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
	# smart-enter: Enter でディレクトリなら中に入り、ファイルなら開く
	# (デフォルトはディレクトリも edit で開くため、エディタが起動してしまう)
	{ on = "<Enter>",    run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },

	# smart-filter: 絞り込み結果が1件になったら自動で入る / 開く
	{ on = "F",          run = "plugin smart-filter", desc = "Smart filter" },

	# toggle-pane: プレビューを最大化 / 親ディレクトリのペインを隠す
	{ on = "T",          run = "plugin toggle-pane max-preview", desc = "Maximize or restore the preview pane" },
	{ on = [ "t", "p" ], run = "plugin toggle-pane min-parent",  desc = "Show or hide the parent pane" },

	# chmod: 選択中のファイルの権限を変更する (Windows には chmod が無いため Unix のみ)
	{ on = [ "c", "m" ], run = "plugin chmod", desc = "Chmod on selected files", for = "unix" },

	# コマンドを実行し、キーを押すまで出力を表示したままにする (go run . など)
	{ on = ":",          run = "plugin shell-wait", desc = "Run a shell command and wait for a key" },

	# 現在のディレクトリでシェルを開く (exit で Yazi に戻る)
	# Windows の shell は cmd.exe で実行され、$SHELL も無いため PowerShell を直接指定する
	{ on = "!",          run = 'shell "$SHELL" --block', desc = "Open $SHELL here", for = "unix" },
	{ on = "!",          run = 'shell "pwsh.exe" --block', desc = "Open PowerShell here", for = "windows" },

	# Git リポジトリのルートへ移動する (cmd.exe には $(...) が無いため Windows は PowerShell で実行)
	{ on = [ "g", "r" ], run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"', desc = "Go to the Git root", for = "unix" },
	{ on = [ "g", "r" ], run = 'shell -- pwsh -NoProfile -Command "ya emit cd (git rev-parse --show-toplevel)"', desc = "Go to the Git root", for = "windows" },

	# よく使うディレクトリへ移動する
	{ on = [ "g", "D" ], run = "cd ~/dotfiles", desc = "Go to ~/dotfiles" },
]
