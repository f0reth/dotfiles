shell = "zsh"

# プラグインは記述順に読み込まれる
# defer を適用したものは .zshrc の読み込み完了後 (compinit の後) に順番に読み込まれる
[templates]
defer = "{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}"

[plugins]

# 遅延読み込み用 (defer テンプレートより前に読み込む必要がある)
[plugins.zsh-defer]
github = "romkatv/zsh-defer"

# 補完定義の追加 (compinit より前に fpath へ追加する必要がある)
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
dir = "src"
apply = ["fpath"]

# fzf で補完候補を選択 (compinit の後、ウィジェットをラップするプラグインより前に読み込む)
[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"
apply = ["defer"]

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
apply = ["defer"]

# シンタックスハイライト (最後に読み込む)
[plugins.fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"
apply = ["defer"]
