# ----------------------------
# UI
# ----------------------------
# OSC は scripts/modernz.lua (https://github.com/Samillion/ModernZ) を使う
osc=no

# ModernZ の sub_margins が字幕を OSC の上へ動かすため、その sub-pos を再生位置と一緒に保存しない
watch-later-options-remove=sub-pos

# ----------------------------
# Renderer
# ----------------------------
# v0.41 から gpu-next がデフォルトだが、hwdec=d3d11va と組み合わせるため D3D11 を明示する
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11

# scale=ewa_lanczossharp / scale-antiring=0.6 などを含む
profile=high-quality

# ----------------------------
# Hardware Decode
# ----------------------------
# hwdec=auto は v0.41 から Vulkan を優先するため、D3D11 描画に合わせて固定する
hwdec=d3d11va
# d3d11va-zero-copy は実測で差がなく (RTX 4070 Ti, 1080p→1440p で 0.52ms/frame のまま)、
# 端の描画乱れやドライバ不具合のリスクだけが残るため使わない

# ----------------------------
# Scaling
# ----------------------------
dscale=mitchell
cscale=mitchell

# ----------------------------
# Image Quality
# ----------------------------
# high-quality プロファイルには含まれない
deband=yes

# ----------------------------
# Cache
# ----------------------------
# デフォルトは MPV_HOME があっても Scoop の portable_config/cache になるため、dotfiles 側 (gitignore 済み) に置く
gpu-shader-cache-dir=~~/cache

# ----------------------------
# Window
# ----------------------------
autofit-larger=50%
keep-open=yes
idle=yes

# Thumbfast の設定は script-opts/thumbfast.conf に書く
# (thumbfast はサムネイル用の mpv を --no-config で起動するため、ここにプロファイルを書いても使われない)
