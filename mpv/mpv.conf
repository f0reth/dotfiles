# ----------------------------
# UI
# ----------------------------
osc=no

# ----------------------------
# Renderer
# ----------------------------
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11

profile=high-quality

# ----------------------------
# Hardware Decode
# ----------------------------
hwdec=d3d11va

# GPU内の余分なdecoder surface copyを削減
d3d11va-zero-copy=yes

# ----------------------------
# A/V Sync
# ----------------------------
# 現環境で最も安定
video-sync=audio
interpolation=no

# ----------------------------
# Scaling
# ----------------------------
scale=ewa_lanczossharp
dscale=mitchell
cscale=mitchell

# ----------------------------
# Image Quality
# ----------------------------
deband=yes
dither-depth=auto

# ----------------------------
# D3D11
# ----------------------------
# DWMとの不要なbackbuffer copyを抑制
d3d11-flip=yes

# Shader compilation cache
gpu-shader-cache=yes

# ----------------------------
# Window
# ----------------------------
autofit-larger=50%
keep-open=yes
idle=yes

# ----------------------------
# Thumbfast
# ----------------------------
[thumbfast]
network=no
audio=no
sub=no
profile=fast
hwdec=auto
