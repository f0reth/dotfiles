# ----------------------------
# GLSL shaders
# ----------------------------
# SSimDownscaler は linear-downscaling=no 前提のため、CTRL+3 だけ切り替え、他では既定値 (yes) に戻す

# Anime4K Mode C+A を UL モデルで構成 (公式の並び順: Upscale_Denoise → AutoDownscalePre → Restore → Upscale)
CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_UL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Restore_CNN_UL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_UL.glsl"; no-osd set linear-downscaling yes; show-text "Anime4K: Ultra HQ (Denoise UL)"
# Anime4K 公式 Mode C+A (HQ)。UL の約 3 倍速いので 60fps 素材向け (1080p→1440p で UL 約 68fps / HQ 約 188fps)
CTRL+4 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; no-osd set linear-downscaling yes; show-text "Anime4K: HQ (Mode C+A)"
CTRL+2 no-osd change-list glsl-shaders set "~~/shaders/arnet_f8b64_hdn.glsl;~~/shaders/KrigBilateral-emoeen.glsl;~~/shaders/Adaptive_sharpen_RT.glsl"; no-osd set linear-downscaling yes; show-text "arnet + Krig + Adaptive"
CTRL+3 no-osd change-list glsl-shaders set "~~/shaders/FSRCNNX_x2_8-0-4-1.glsl;~~/shaders/SSimDownscaler.glsl;~~/shaders/KrigBilateral-emoeen.glsl"; no-osd set linear-downscaling no; show-text "FSRCNNX + SSim + Krig"

CTRL+0 no-osd change-list glsl-shaders clr ""; no-osd set linear-downscaling yes; show-text "GLSL shaders cleared"

# ----------------------------
# Playback
# ----------------------------
[ add speed -0.1
] add speed 0.1
